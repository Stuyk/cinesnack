<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>CineSnack</title>
    <link rel="icon" type="image/png" href="./assets/app-icon.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: media:; connect-src 'self' blob: media:"
    />
  </head>

  <body>
    <!-- Shown until the app mounts and ffmpeg is ready. Inline so it paints on the first frame. -->
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <img src="./assets/app-icon.png" width="56" height="56" alt="" />
        <div class="boot-name">CineSnack</div>
        <div class="boot-bar"><span></span></div>
        <div class="boot-text">Loading…</div>
      </div>
    </div>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1620;
      }
      .boot {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #e8eef7;
        font:
          13px system-ui,
          sans-serif;
      }
      .boot-name {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .boot-bar {
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: #1b2533;
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #4ea1ff;
        animation: boot 1.1s ease-in-out infinite;
      }
      .boot-text {
        color: #b2bfd1;
      }
      @keyframes boot {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
